# Server blocks do domínio allugme.com.br (HTTP→HTTPS + TLS Let's Encrypt).
# Inseridos pelo CD em /var/www/nginx/nginx.conf.
# Vitrine pública: https://www.allugme.com.br/{slug}/
# Painel/API:     https://www.allugme.com.br/allugme/

  # Novos hosts protegidos por TLS na borda da Cloudflare.
  server {
    listen 80;
    server_name allugme.online www.allugme.online app.allugme.online;

    location = / { return 302 /allugme/; }
    location ^~ /allugme/ {
      set $upstream_allugme http://allugme-frontend:80;
      rewrite ^/allugme/(.*)$ /$1 break;
      proxy_pass $upstream_allugme;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location / { return 302 /allugme/; }
  }

  server {
    listen 80;
    server_name api.allugme.online;
    location / {
      set $upstream_allugme_api http://allugme-api:8080;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
  }

  server {
    listen 80;
    server_name ~^(?<tenant_slug>[a-z0-9][a-z0-9-]*)\.allugme\.online$;
    location ^~ /themes/ {
      set $upstream_allugme_api http://allugme-api:8080;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location / {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/(.*)$ /t/$tenant_slug/$1 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
  }

  server {
    listen 80;
    server_name allugme.com.br www.allugme.com.br;

    location / {
      return 301 https://www.allugme.com.br$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name allugme.com.br;

    ssl_certificate /etc/letsencrypt/live/allugme.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allugme.com.br/privkey.pem;

    location / {
      return 301 https://www.allugme.com.br$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name www.allugme.com.br;

    ssl_certificate /etc/letsencrypt/live/allugme.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allugme.com.br/privkey.pem;

    # Landing/painel SaaS
    location = / {
      return 301 /allugme/;
    }

    location = /allugme/swagger {
      return 301 /allugme/swagger/index.html;
    }

    location = /allugme/swagger/ {
      return 301 /allugme/swagger/index.html;
    }

    location ^~ /allugme/swagger/ {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/allugme/swagger/(.*)$ /swagger/$1 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /allugme/api/ {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/allugme/api/(.*)$ /api/$1 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # Legado: /allugme/t/{slug}/ → /{slug}/
    location ^~ /allugme/t/ {
      rewrite ^/allugme/t/(.*)$ /$1 permanent;
    }

    # Assets de tema na raiz (HTML da vitrine)
    location ^~ /themes/ {
      set $upstream_allugme_api http://allugme-api:8080;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # Compat: /allugme/themes/ → /themes/
    location ^~ /allugme/themes/ {
      rewrite ^/allugme/themes/(.*)$ /themes/$1 permanent;
    }

    location ^~ /allugme/ {
      set $upstream_allugme http://allugme-frontend:80;
      rewrite ^/allugme/(.*)$ /$1 break;
      proxy_pass $upstream_allugme;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # Vitrine: /{slug}/… → API /t/{slug}/…
    # Exclui prefixos reservados (painel, assets, etc.)
    location ~ ^/(?!allugme(?:/|$)|themes(?:/|$)|media(?:/|$)|api(?:/|$)|swagger(?:/|$)|health(?:/|$)|favicon\.ico$|robots\.txt$)([a-z0-9][a-z0-9-]*)(/.*)?$ {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/([^/]+)(/.*)?$ /t/$1$2 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      return 301 /allugme/;
    }
  }
