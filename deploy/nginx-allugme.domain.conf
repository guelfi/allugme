# Server blocks do domínio allugme.com.br (HTTP→HTTPS + TLS Let's Encrypt).
# Inseridos pelo CD em /var/www/nginx/nginx.conf.

  server {
    listen 80;
    server_name allugme.com.br www.allugme.com.br;

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name allugme.com.br www.allugme.com.br;

    ssl_certificate /etc/letsencrypt/live/allugme.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allugme.com.br/privkey.pem;

    location = / {
      return 301 /allugme/;
    }

    location = /allugme/swagger {
      return 301 /allugme/swagger/index.html;
    }

    location = /allugme/swagger/ {
      return 301 /allugme/swagger/index.html;
    }

    location ^~ /allugme/swagger/ {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/allugme/swagger/(.*)$ /swagger/$1 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /allugme/api/ {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/allugme/api/(.*)$ /api/$1 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /allugme/t/ {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/allugme/t/(.*)$ /t/$1 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /allugme/themes/ {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/allugme/themes/(.*)$ /themes/$1 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /allugme/ {
      set $upstream_allugme http://allugme-frontend:80;
      rewrite ^/allugme/(.*)$ /$1 break;
      proxy_pass $upstream_allugme;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      return 301 /allugme/;
    }
  }
