# Hosts canônicos do Allugme protegidos pela Cloudflare.
# Site comercial: https://allugme.online/
# Painel:         https://app.allugme.online/
# API:            https://api.allugme.online/
# Vitrines:       https://{slug}.allugme.online/

  server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name allugme.online;

    ssl_certificate /etc/letsencrypt/live/allugme.online/origin.pem;
    ssl_certificate_key /etc/letsencrypt/live/allugme.online/origin.key;

    location = /allugme { return 301 https://app.allugme.online/; }
    location ^~ /allugme/ {
      rewrite ^/allugme/(.*)$ https://app.allugme.online/$1 permanent;
    }
    location ~ ^/(?:login|register|forgot-password|reset-password|accept-invite|portal|painel|properties|visits|team|clients|settings|theme|admin)(?:/.*)?$ {
      return 301 https://app.allugme.online$request_uri;
    }
    location / {
      set $upstream_allugme http://allugme-frontend:80;
      proxy_pass $upstream_allugme;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
  }

  server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name www.allugme.online;

    ssl_certificate /etc/letsencrypt/live/allugme.online/origin.pem;
    ssl_certificate_key /etc/letsencrypt/live/allugme.online/origin.key;

    return 301 https://allugme.online$request_uri;
  }

  server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name app.allugme.online;

    ssl_certificate /etc/letsencrypt/live/allugme.online/origin.pem;
    ssl_certificate_key /etc/letsencrypt/live/allugme.online/origin.key;

    location = /allugme { return 301 /; }
    location ^~ /allugme/ {
      rewrite ^/allugme/(.*)$ /$1 permanent;
    }
    location = / { return 302 /login; }
    location / {
      set $upstream_allugme http://allugme-frontend:80;
      proxy_pass $upstream_allugme;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
  }

  server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name api.allugme.online;

    ssl_certificate /etc/letsencrypt/live/allugme.online/origin.pem;
    ssl_certificate_key /etc/letsencrypt/live/allugme.online/origin.key;

    location / {
      set $upstream_allugme_api http://allugme-api:8080;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
  }

  server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name ~^(?<tenant_slug>[a-z0-9][a-z0-9-]*)\.allugme\.online$;

    ssl_certificate /etc/letsencrypt/live/allugme.online/origin.pem;
    ssl_certificate_key /etc/letsencrypt/live/allugme.online/origin.key;

    location ^~ /themes/ {
      set $upstream_allugme_api http://allugme-api:8080;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location / {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/(.*)$ /t/$tenant_slug/$1 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
  }

  # Domínio legado: mantém o e-mail no .com.br, mas canonicaliza todo tráfego web.
  server {
    listen 80;
    server_name allugme.com.br www.allugme.com.br;

    location = /allugme { return 301 https://app.allugme.online/; }
    location ^~ /allugme/ {
      rewrite ^/allugme/(.*)$ https://app.allugme.online/$1 permanent;
    }
    location ~ ^/(?!themes(?:/|$)|media(?:/|$)|api(?:/|$)|swagger(?:/|$)|health(?:/|$)|favicon\.ico$|robots\.txt$)([a-z0-9][a-z0-9-]*)(/.*)?$ {
      return 301 https://$1.allugme.online$2;
    }
    location / { return 301 https://allugme.online$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name allugme.com.br www.allugme.com.br;

    ssl_certificate /etc/letsencrypt/live/allugme.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allugme.com.br/privkey.pem;

    location = /allugme { return 301 https://app.allugme.online/; }
    location ^~ /allugme/ {
      rewrite ^/allugme/(.*)$ https://app.allugme.online/$1 permanent;
    }
    location ~ ^/(?!themes(?:/|$)|media(?:/|$)|api(?:/|$)|swagger(?:/|$)|health(?:/|$)|favicon\.ico$|robots\.txt$)([a-z0-9][a-z0-9-]*)(/.*)?$ {
      return 301 https://$1.allugme.online$2;
    }
    location / { return 301 https://allugme.online$request_uri; }
  }
