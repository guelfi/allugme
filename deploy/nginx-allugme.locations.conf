# Fragmento inserido pelo CD no nginx-proxy (OCI / IP / nginx-local).
# Painel/API: /allugme/…
# Vitrine:    /loja/{slug}/  (legado: /{slug}/ e /allugme/t/{slug}/ redirecionam)

    # ---- Allugme API / Swagger / Vitrine ----------------------------------
    location = /allugme/swagger {
      return 301 /allugme/swagger/index.html;
    }

    location = /allugme/swagger/ {
      return 301 /allugme/swagger/index.html;
    }

    location ^~ /allugme/swagger/ {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/allugme/swagger/(.*)$ /swagger/$1 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /allugme/api/ {
      client_max_body_size 60m;
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/allugme/api/(.*)$ /api/$1 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legado: /allugme/t/{slug}/ → /loja/{slug}/
    location ^~ /allugme/t/ {
      rewrite ^/allugme/t/(.*)$ /loja/$1 permanent;
    }

    location ^~ /themes/ {
      set $upstream_allugme_api http://allugme-api:8080;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /allugme/themes/ {
      rewrite ^/allugme/themes/(.*)$ /themes/$1 permanent;
    }

    # Arquivos públicos enviados (avatares e demais mídias).
    location ^~ /media/ {
      set $upstream_allugme_api http://allugme-api:8080;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /allugme/media/ {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/allugme/media/(.*)$ /media/$1 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Allugme Frontend ------------------------------------------------
    location ^~ /allugme/ {
      set $upstream_allugme http://allugme-frontend:80;
      rewrite ^/allugme/(.*)$ /$1 break;
      proxy_pass $upstream_allugme;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vitrine (canônico): /loja/{slug}/… → API /t/{slug}/…
    # Prefixo dedicado (allowlist real via location ^~): só captura o que
    # começa com /loja/, nunca colide com rotas de outros projetos no
    # gateway compartilhado — ver
    # docs/handoff/PENDENCIA-nginx-vitrine-regex-conflita-static-outros-projetos.md.
    location = /loja {
      return 301 /loja/;
    }

    location ^~ /loja/ {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/loja/([^/]+)(/.*)?$ /t/$1$2 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legado: vitrine servida na raiz (/{slug}/…) antes da migração para
    # /loja/{slug}/. Mantido só como redirect 301 para não quebrar links já
    # compartilhados — não proxeia mais direto para a API. Continua com a
    # lista de exclusão (blocklist) dos demais projetos do gateway
    # compartilhado por compatibilidade, mas não é mais o caminho canônico
    # e não deve ganhar novos prefixos: o /loja/ acima é allowlist de
    # verdade e não precisa de manutenção da lista.
    location ~ ^/(?!allugme(?:/|$)|themes(?:/|$)|media(?:/|$)|api(?:/|$)|swagger(?:/|$)|health(?:/|$)|loja(?:/|$)|driverhub(?:/|$)|hako(?:/|$)|unisystem(?:/|$)|batuara(?:/|$)|bela360(?:/|$)|barbear(?:/|$)|barbear-ia(?:/|$)|portainer(?:/|$)|static(?:/|$)|assets(?:/|$)|_next(?:/|$)|dist(?:/|$)|favicon\.ico$|robots\.txt$)([a-z0-9][a-z0-9-]*)(/.*)?$ {
      return 301 /loja/$1$2;
    }
