# Fragmento inserido pelo CD no nginx-proxy (OCI / IP / nginx-local).
# Painel/API: /allugme/…
# Vitrine:    /{slug}/  (raiz do host; legado /allugme/t/{slug}/ redireciona)

    # ---- Allugme API / Swagger / Vitrine ----------------------------------
    location = /allugme/swagger {
      return 301 /allugme/swagger/index.html;
    }

    location = /allugme/swagger/ {
      return 301 /allugme/swagger/index.html;
    }

    location ^~ /allugme/swagger/ {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/allugme/swagger/(.*)$ /swagger/$1 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /allugme/api/ {
      client_max_body_size 60m;
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/allugme/api/(.*)$ /api/$1 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legado: /allugme/t/{slug}/ → /{slug}/
    location ^~ /allugme/t/ {
      rewrite ^/allugme/t/(.*)$ /$1 permanent;
    }

    location ^~ /themes/ {
      set $upstream_allugme_api http://allugme-api:8080;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /allugme/themes/ {
      rewrite ^/allugme/themes/(.*)$ /themes/$1 permanent;
    }

    # ---- Allugme Frontend ------------------------------------------------
    location ^~ /allugme/ {
      set $upstream_allugme http://allugme-frontend:80;
      rewrite ^/allugme/(.*)$ /$1 break;
      proxy_pass $upstream_allugme;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vitrine na raiz: /{slug}/… → API /t/{slug}/…
    # Exclui prefixos de outros projetos no gateway compartilhado.
    location ~ ^/(?!allugme(?:/|$)|themes(?:/|$)|media(?:/|$)|api(?:/|$)|swagger(?:/|$)|health(?:/|$)|driverhub(?:/|$)|hako(?:/|$)|unisystem(?:/|$)|batuara(?:/|$)|bela360(?:/|$)|barbear(?:/|$)|barbear-ia(?:/|$)|portainer(?:/|$)|favicon\.ico$|robots\.txt$)([a-z0-9][a-z0-9-]*)(/.*)?$ {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/([^/]+)(/.*)?$ /t/$1$2 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
