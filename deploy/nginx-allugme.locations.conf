# Fragmento inserido pelo CD no nginx-proxy (OCI).
# Paths públicos: /allugme/api/ · /allugme/swagger/ · /allugme/t/ · /allugme/

    # ---- Alugue.me API / Swagger / Vitrine (antes do front) -----------------
    location = /allugme/swagger {
      return 301 /allugme/swagger/index.html;
    }

    location = /allugme/swagger/ {
      return 301 /allugme/swagger/index.html;
    }

    location ^~ /allugme/swagger/ {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/allugme/swagger/(.*)$ /swagger/$1 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /allugme/api/ {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/allugme/api/(.*)$ /api/$1 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /allugme/t/ {
      set $upstream_allugme_api http://allugme-api:8080;
      rewrite ^/allugme/t/(.*)$ /t/$1 break;
      proxy_pass $upstream_allugme_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Alugue.me Frontend ------------------------------------------------
    location ^~ /allugme/ {
      set $upstream_allugme http://allugme-frontend:80;
      rewrite ^/allugme/(.*)$ /$1 break;
      proxy_pass $upstream_allugme;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
