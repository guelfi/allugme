name: CD - Deploy to OCI

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Digite YES para confirmar o deploy na OCI'
        required: true
        default: ''
  workflow_run:
    workflows: ["CI - Build & Validate"]
    types:
      - completed

concurrency:
  group: deploy-oci-allugme
  cancel-in-progress: false

jobs:
  validate:
    name: Validate deploy inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch and confirmation
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::Deploy permitido apenas a partir do branch 'main'. Branch atual: ${GITHUB_REF}"
              exit 1
            fi

            CONFIRM_RAW="${{ github.event.inputs.confirm_deploy }}"
            CONFIRM_CLEAN="$(echo "$CONFIRM_RAW" | tr -d '\r\n\t ' | tr '[:lower:]' '[:upper:]')"
            if [ "$CONFIRM_CLEAN" != "YES" ]; then
              echo "::error::Para executar o deploy, preencha confirm_deploy exatamente com YES."
              exit 1
            fi
          fi

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "::error::Deploy automático bloqueado: CI não está verde (conclusion=${{ github.event.workflow_run.conclusion }})."
              exit 1
            fi

            if [ "${{ github.event.workflow_run.head_branch }}" != "main" ]; then
              echo "::error::Deploy automático bloqueado: apenas push em 'main' dispara deploy (branch=${{ github.event.workflow_run.head_branch }})."
              exit 1
            fi
          fi

  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # Padrão Barbear.IA; aliases OCI_SSH_PRIVATE_KEY também existem no repo
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Add OCI host to known_hosts
        run: ssh-keyscan -H ${{ secrets.OCI_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install Cloudflare origin certificate
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USERNAME }}
          ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
          ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
        run: |
          set -euo pipefail
          CERT_FILE="${RUNNER_TEMP}/allugme-online-origin.pem"
          KEY_FILE="${RUNNER_TEMP}/allugme-online-origin.key"
          printf '%s\n' "$ORIGIN_CERT" > "$CERT_FILE"
          printf '%s\n' "$ORIGIN_KEY" > "$KEY_FILE"
          chmod 600 "$CERT_FILE" "$KEY_FILE"

          scp -o StrictHostKeyChecking=no "$CERT_FILE" "${OCI_USER}@${OCI_HOST}:/tmp/allugme-online-origin.pem"
          scp -o StrictHostKeyChecking=no "$KEY_FILE" "${OCI_USER}@${OCI_HOST}:/tmp/allugme-online-origin.key"
          ssh -o StrictHostKeyChecking=no "${OCI_USER}@${OCI_HOST}" 'bash -s' << 'EOF'
            set -euo pipefail
            sudo install -d -m 700 /etc/letsencrypt/live/allugme.online
            sudo install -m 644 /tmp/allugme-online-origin.pem /etc/letsencrypt/live/allugme.online/origin.pem
            sudo install -m 600 /tmp/allugme-online-origin.key /etc/letsencrypt/live/allugme.online/origin.key
            rm -f /tmp/allugme-online-origin.pem /tmp/allugme-online-origin.key
          EOF

          rm -f "$CERT_FILE" "$KEY_FILE"

      - name: Deploy to OCI server
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USERNAME }}
        run: |
          ssh -o StrictHostKeyChecking=no ${OCI_USER}@${OCI_HOST} 'bash -s' << 'EOF'
            set -euo pipefail
            APP_DIR=/var/www/allugme
            REPO_URL=https://github.com/guelfi/allugme.git

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Bootstrap: clonando repositório em $APP_DIR"
              sudo mkdir -p "$APP_DIR"
              sudo chown -R "$(whoami):$(whoami)" "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin
            git reset --hard origin/main

            if [ ! -f .env ]; then
              printf '%s\n' \
                'VITE_API_URL=https://api.allugme.online/api/v1' \
                'VITE_BASE_PATH=/allugme/' \
                'POSTGRES_DB=allugme' \
                'POSTGRES_USER=allugme' \
                'POSTGRES_PASSWORD=allugme_oci_change_me' \
                'Jwt__SigningKey=CHANGE_ME_OCI_Allugme_Jwt_Signing_Key_32chars+' \
                'Seed__Enabled=true' \
                'Seed__DemoData=true' \
                'Seed__DemoPassword=Demo@123456' \
                'Seed__SuperAdmin__Email=admin@allugme.com.br' \
                'Seed__SuperAdmin__Password=Admin123#' \
                'Swagger__Enabled=true' \
                'Evolution__Enabled=false' \
                > .env
              echo "Created default .env — altere Jwt/Postgres em produção."
            fi

            if grep -q '^VITE_API_URL=' .env; then
              sed -i 's|^VITE_API_URL=.*|VITE_API_URL=https://api.allugme.online/api/v1|' .env
            else
              printf '%s\n' 'VITE_API_URL=https://api.allugme.online/api/v1' >> .env
            fi
            if grep -q '^App__DashboardBaseUrl=' .env; then
              sed -i 's|^App__DashboardBaseUrl=.*|App__DashboardBaseUrl=https://app.allugme.online/allugme|' .env
            else
              printf '%s\n' 'App__DashboardBaseUrl=https://app.allugme.online/allugme' >> .env
            fi

            # Mantém a identidade administrativa canônica também em instalações existentes.
            if grep -q '^Seed__SuperAdmin__Email=' .env; then
              sed -i 's/^Seed__SuperAdmin__Email=.*/Seed__SuperAdmin__Email=admin@allugme.com.br/' .env
            else
              printf '%s\n' 'Seed__SuperAdmin__Email=admin@allugme.com.br' >> .env
            fi

            # Rede compartilhada do nginx-proxy (paridade Barbear.IA / bela360)
            sudo docker network inspect www_projetos-net >/dev/null 2>&1 || sudo docker network create www_projetos-net

            sudo docker compose --env-file .env up -d --build --remove-orphans

            # Garante que o nginx-proxy alcança os containers allugme
            sudo docker network connect www_projetos-net allugme-api 2>/dev/null || true
            sudo docker network connect www_projetos-net allugme-frontend 2>/dev/null || true
            sudo docker network connect allugme_allugme-net nginx-proxy 2>/dev/null || true

            if [ -f /var/www/nginx/nginx.conf ]; then
              sudo python3 deploy/apply-nginx-allugme.py \
                /var/www/nginx/nginx.conf \
                deploy/nginx-allugme.locations.conf \
                deploy/nginx-allugme.domain.conf
              sudo docker exec nginx-proxy nginx -t
              sudo docker exec nginx-proxy nginx -s reload
            else
              echo "::warning::/var/www/nginx/nginx.conf não encontrado — skip reload nginx"
            fi

          EOF

      - name: Verify deployment
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USERNAME }}
        run: |
          echo "Waiting for stack to stabilize..."
          sleep 35
          ssh -o StrictHostKeyChecking=no ${OCI_USER}@${OCI_HOST} "sudo docker ps --filter name=allugme --format 'table {{.Names}}\t{{.Status}}'"
          ssh -o StrictHostKeyChecking=no ${OCI_USER}@${OCI_HOST} "sudo docker exec allugme-frontend wget -q -O /dev/null http://127.0.0.1/health && echo 'frontend health OK' || echo 'frontend health FAILED'"
          ssh -o StrictHostKeyChecking=no ${OCI_USER}@${OCI_HOST} "sudo docker exec allugme-api curl -fsS http://127.0.0.1:8080/health && echo && echo 'api health OK' || echo 'api health FAILED'"
          ssh -o StrictHostKeyChecking=no ${OCI_USER}@${OCI_HOST} "curl -fsS -o /dev/null -w 'public front HTTP %{http_code}\n' http://127.0.0.1/allugme/ || true"
          ssh -o StrictHostKeyChecking=no ${OCI_USER}@${OCI_HOST} "curl -fsS -o /dev/null -w 'public swagger HTTP %{http_code}\n' http://127.0.0.1/allugme/swagger/index.html || true"
          ssh -o StrictHostKeyChecking=no ${OCI_USER}@${OCI_HOST} "curl -fsS -o /dev/null -w 'public health API via path HTTP %{http_code}\n' http://127.0.0.1/allugme/api/v1/../health 2>/dev/null || curl -fsS -o /dev/null -w 'api rewrite probe %{http_code}\n' http://127.0.0.1/allugme/swagger/index.html || true"
          echo "=== Deployed commit (server) ==="
          ssh -o StrictHostKeyChecking=no ${OCI_USER}@${OCI_HOST} "cd /var/www/allugme && git log -1 --oneline"
