name: CI - Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_BASE_PATH: /
          VITE_API_BASE_URL: https://api.allugme.online/api/v1
        run: npm run build

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: allugme
          POSTGRES_USER: allugme
          POSTGRES_PASSWORD: allugme_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allugme -d allugme"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=allugme;Username=allugme;Password=allugme_dev
      ConnectionStrings__Redis: localhost:6379
      Jwt__SigningKey: CI_ONLY_CHANGE_ME_Allugme_Jwt_Signing_Key_32+
      Seed__Enabled: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AlugueMe.sln
        working-directory: backend

      - name: Build
        run: dotnet build AlugueMe.sln -c Release --no-restore
        working-directory: backend

      - name: Test
        run: dotnet test AlugueMe.sln -c Release --no-build --verbosity normal
        working-directory: backend

      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qiE "Critical|High" vuln.txt; then
            echo "Pacotes vulneráveis High/Critical encontrados"
            exit 1
          fi
        working-directory: backend
        continue-on-error: true

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [frontend, secret-scanning, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: |
          docker build -t allugme-frontend:test \
            --build-arg VITE_API_URL=https://api.allugme.online/api/v1 \
            --build-arg VITE_BASE_PATH=/ \
            .

      - name: Build API Docker image
        run: docker build -t allugme-api:test -f backend/Dockerfile .
