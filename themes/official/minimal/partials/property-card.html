<article class="property-card">
  <a href="property.html">
    <div class="property-card__media">
      <img src="{{property.images}}" alt="{{property.title}}" loading="lazy" width="640" height="480" />
      <span class="badge badge--{{property.operation}}">{{property.operation}}</span>
    </div>
    <div class="property-card__body">
      <p class="property-card__price">{{property.price}}</p>
      <h3 class="property-card__title">{{property.title}}</h3>
      <p class="property-card__meta">{{property.neighborhood}}, {{property.city}} · {{property.bedrooms}} quarto(s)</p>
    </div>
  </a>
</article>
