<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{tenant.name}} — Início</title>
  <link rel="stylesheet" href="../assets/css/main.css?v=lote1-onda1" />
  <link rel="icon" type="image/svg+xml" href="{{tenant.favicon_url}}" />
</head>
<body>
  <!-- partial:header -->

  <section class="hero">
    <div class="hero__media" aria-hidden="true">
      <img
        src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600&q=80"
        alt=""
        width="1600"
        height="900"
      />
      <div class="hero__shade"></div>
    </div>
    <div class="container hero__content">
      <p class="hero__brand" data-bind="tenant.name">{{tenant.name}}</p>
      <h1 class="hero__title">Encontre um lar com a clareza de uma plataforma moderna</h1>
      <p class="hero__lead">Locação e compra com busca rápida e visita agendada no horário certo.</p>
      <div class="hero__cta">
        <a class="btn btn--on-dark" href="listing.html">Buscar imóveis</a>
        <a class="btn btn--outline-light" href="schedule.html">Agendar visita</a>
      </div>
    </div>
  </section>

  <div class="search-strip">
    <div class="container">
      <form class="search-strip__panel" action="listing.html" method="get" data-search-filters>
        {{search.filters}}
        <div class="field">
          <label for="city">Cidade</label>
          <input id="city" name="city" type="search" placeholder="Busque por cidade" />
        </div>
        <div class="field">
          <label for="neighborhood">Bairro</label>
          <input id="neighborhood" name="neighborhood" type="search" placeholder="Busque por bairro" />
        </div>
        <div class="field">
          <label for="price">Valor até</label>
          <select id="price" name="price">
            <option value="">Qualquer</option>
            <option value="3000">R$ 3.000</option>
            <option value="5000">R$ 5.000</option>
            <option value="10000">R$ 10.000</option>
            <option value="1000000">R$ 1 mi</option>
          </select>
        </div>
        <div class="field">
          <label for="bedrooms">Quartos</label>
          <select id="bedrooms" name="bedrooms">
            <option value="">Todos</option>
            <option value="1">1+</option>
            <option value="2">2+</option>
            <option value="3">3+</option>
          </select>
        </div>
        <button class="btn btn--primary" type="submit">Buscar imóveis</button>
      </form>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="section__head">
        <div>
          <h2>Imóveis em destaque</h2>
          <p>Seleção atualizada da carteira · {{tenant.name}}</p>
        </div>
        <a class="btn btn--ghost" href="listing.html">Ver todos</a>
      </div>
      <div class="grid-properties" data-demo-properties>
        {{properties}}
      </div>
    </div>
  </section>

  <!-- partial:footer -->
  <script src="../assets/js/main.js"></script>
</body>
</html>
