<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8" /><title>Visita confirmada</title></head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 12px;"><tr><td align="center">
<table role="presentation" width="100%" style="max-width:560px;background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden;">
<tr><td style="background:{{brand_color}};padding:20px 24px;"><p style="margin:0;font-size:20px;font-weight:700;color:#fff;">{{brand_name}}</p></td></tr>
<tr><td style="padding:28px 24px;">
<h1 style="margin:0 0 12px;font-size:22px;">Visita confirmada</h1>
<p style="margin:0 0 12px;font-size:15px;line-height:1.55;color:#334155;">Olá, {{user_name}}. Sua visita ao imóvel <strong>{{property_title}}</strong> foi {{status_label}}.</p>
<p style="margin:0 0 24px;font-size:15px;color:#334155;"><strong>Quando:</strong> {{visit_when}}</p>
<p style="margin:0 0 16px;font-size:14px;color:#64748b;">Acompanhe suas visitas no portal do cliente Allugme.</p>
<a href="{{{portal_url}}}" style="display:inline-block;padding:12px 22px;background:{{accent_color}};color:#fff;font-weight:700;text-decoration:none;border-radius:8px;">Abrir portal</a>
</td></tr>
</table></td></tr></table>
</body></html>
