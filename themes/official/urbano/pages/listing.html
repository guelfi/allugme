<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{tenant.name}} — Imóveis</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body data-theme="urbano">
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="home.html"><span data-bind="tenant.name">{{tenant.name}}</span></a>
      <nav class="nav" aria-label="Principal">
        <a href="home.html">Início</a>
        <a href="listing.html" aria-current="page">Imóveis</a>
        <a href="schedule.html">Agendar visita</a>
      </nav>
      <div class="header-actions">
        <a class="phone-link" href="tel:{{tenant.phone}}" data-bind="tenant.phone">{{tenant.phone}}</a>
        <button class="menu-toggle" type="button" data-menu-toggle aria-label="Abrir menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
    <nav class="nav--mobile" data-nav-mobile>
      <a href="home.html">Início</a>
      <a href="listing.html">Imóveis</a>
      <a href="schedule.html">Agendar visita</a>
    </nav>
  </header>

  <div class="container listing-layout">
    <aside class="filters" aria-label="Filtros">
      <h2>Filtros</h2>
      <form action="listing.html" method="get" data-search-filters>
        {{search.filters}}
        <div class="field">
          <label for="city">Cidade</label>
          <input id="city" name="city" type="search" placeholder="Cidade" />
        </div>
        <div class="field">
          <label for="neighborhood">Bairro</label>
          <input id="neighborhood" name="neighborhood" type="search" placeholder="Bairro" />
        </div>
        <div class="field">
          <label for="operation">Operação</label>
          <select id="operation" name="operation">
            <option value="">Todas</option>
            <option value="rent">Alugar</option>
            <option value="sale">Comprar</option>
          </select>
        </div>
        <div class="field">
          <label for="price">Valor até</label>
          <select id="price" name="price">
            <option value="">Qualquer</option>
            <option value="3000">R$ 3.000</option>
            <option value="5000">R$ 5.000</option>
            <option value="1000000">R$ 1 mi</option>
          </select>
        </div>
        <div class="field">
          <label for="bedrooms">Quartos</label>
          <select id="bedrooms" name="bedrooms">
            <option value="">Todos</option>
            <option value="1">1+</option>
            <option value="2">2+</option>
            <option value="3">3+</option>
          </select>
        </div>
        <button class="btn btn--primary btn--block" type="submit">Aplicar</button>
      </form>
    </aside>

    <section>
      <div class="listing-toolbar">
        <h1>Imóveis disponíveis</h1>
        <span>Resultados da carteira</span>
      </div>
      <div class="grid-properties" data-demo-properties>
        {{properties}}
      </div>
    </section>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p class="site-footer__copy">© <span data-bind="tenant.name">{{tenant.name}}</span> · <a href="tel:{{tenant.phone}}" data-bind="tenant.phone">{{tenant.phone}}</a></p>
    </div>
  </footer>
  <script src="../assets/js/main.js"></script>
</body>
</html>
